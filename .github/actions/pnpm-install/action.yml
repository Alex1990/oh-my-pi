name: "Node install (shared pnpm store)"
description: >
   Ensure Node 24 and the pnpm version pinned by package.json's
   `packageManager` field are available, then run
   `pnpm install --frozen-lockfile` with the pnpm store cached by
   actions/setup-node.

runs:
   using: composite
   steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
           run_install: false

      - name: Setup Node with pnpm store cache
        uses: actions/setup-node@v4
        with:
           node-version: 24
           cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
           # A shared pnpm store (setup-node's cache on GitHub-hosted runners,
           # a mounted PVC on omp-kata) can hand a job a corrupt or partially
           # written tarball when parallel jobs touch the same entry. That
           # aborts the install with an integrity/extraction error, and the
           # offending blob is content-hash-named rather than derivable from
           # the package name, so retry against a fresh job-local store dir:
           # this forces a clean re-download without mutating the shared store
           # other concurrent jobs rely on. The warm shared cache stays the
           # fast path; the cold retry only runs on the rare corruption (also
           # covers a transient network blip on attempt 1).
           if pnpm install --frozen-lockfile; then
             exit 0
           fi
           echo "::warning title=pnpm install retry::shared pnpm store install failed; retrying with a clean job-local store"
           retry_store="$(mktemp -d "${RUNNER_TEMP:-/tmp}/pnpm-store-retry.XXXXXX")"
           pnpm install --frozen-lockfile --store-dir="$retry_store"
